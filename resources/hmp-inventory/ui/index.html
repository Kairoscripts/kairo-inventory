<script>
"use strict";
const italian = globalThis.KairoInventoryLanguages.it;
let messages = italian;
let language = "it";
const t = (key, values = {}) => (messages[key] ?? key).replace(/\{(\w+)\}/g, (placeholder, name) => values[name] ?? placeholder);
const find=id=>document.getElementById(id);
const grid=find("grid"), detail=find("detail"), error=find("error");
const rows=new Map(), cards=new Map();
const fallback="./icons/item.png";
const categories={Tutti:"all",Pozioni:"potions",Ingredienti:"ingredients",Equipaggiamento:"gear"};
let category="Tutti",selected=null,pending=false,actionTimer=0,frame=0,closeKey="f2";
function send(name,value={}){try{callEvent(name,JSON.stringify(value))}catch{}}
function node(tag,style,text){const element=document.createElement(tag);if(style)element.className=style;if(text!==undefined)element.textContent=text;return element}
function group(item){
  const category=String(item.category||"").toLowerCase();
  if(item.family||item.kind==="mount")return "Equipaggiamento";
  if(item.kind==="gear"||item.kind==="tool")return "Equipaggiamento";
  if(/potion|pozione/.test(category))return "Pozioni";
  if(/forage|ingredient|resource|risors/.test(category))return "Ingredienti";
  return "Altro";
}
function setImage(img,icon){
  const path=/^(?:\.\/icons\/|fw:\/\/resources\/)/i.test(icon||"")?icon:fallback;
  if(img.dataset.path===path)return;
  img.dataset.path=path;
  img.onerror=()=>{img.onerror=null;img.src=fallback};
  img.src=path;
}
function renderDetail(){
  detail.replaceChildren();
  const item=rows.get(selected);
  if(!item){detail.append(node("p","",t("selectItem")));return}
  const img=node("img");img.alt="";setImage(img,item.icon);
  const text=node("div");
  text.append(node("strong","",item.label),node("p","",item.equipped?t("equipped"):item.description||(t("quantity")+item.amount)));
  detail.append(img,text);
  const actions=node("div","detail-actions");
  for(const action of [item.secondary,item.action].filter(Boolean)){
    const button=node("button","",pending?t("waiting"):t(action));
    button.disabled=pending;
    button.dataset.action=action;
    button.onclick=()=>{
      if(pending)return;
      pending=true;error.textContent="";renderDetail();
      send("action",{key:item.key,action});
      actionTimer=setTimeout(()=>{pending=false;error.textContent=t("timeout");renderDetail();},8000);
    };
    actions.append(button);
  }
  if(actions.children.length)detail.append(actions);
}
function highlight(){
  for(const [key,card] of cards){
    const active=key===selected;
    card.element.classList.toggle("active",active);
    card.element.setAttribute("aria-pressed",String(active));
  }
}
function render(){
  frame=0;
  const query=find("search").value.trim().toLocaleLowerCase(language);
  const visible=[...rows.values()].filter(item=>(category==="Tutti"||group(item)===category)&&(!query||item.label.toLocaleLowerCase(language).includes(query)));
  const wanted=new Set(visible.map(item=>item.key));
  if(!wanted.has(selected))selected=null;
  for(const [key,card] of cards)if(!wanted.has(key)){card.element.remove();cards.delete(key)}
  grid.querySelectorAll(".empty-slot,.no-results").forEach(element=>element.remove());
  for(const item of visible){
    let card=cards.get(item.key);
    if(!card){
      const element=node("button","slot"), img=node("img"), name=node("span","name"), amount=node("span","amount");
      img.alt="";element.append(amount,img,name);
      element.onclick=()=>{selected=item.key;highlight();renderDetail()};
      card={element,img,name,amount};
      cards.set(item.key,card);
      grid.append(element);
    }
    if(card.item!==item){
      setImage(card.img,item.icon);
      card.name.textContent=item.label;
      card.amount.textContent=item.equipped?"✓":"×"+item.amount;
      card.element.title=item.label+(item.equipped?" · "+t("equipped"):"");
      card.item=item;
    }
  }
  if(!query&&category==="Tutti"){
    for(let i=visible.length;i<18;i++){const slot=node("span","empty-slot");slot.setAttribute("aria-hidden","true");grid.append(slot)}
  }else if(!visible.length)grid.append(node("p","no-results",t("noResults")));
  highlight();renderDetail();
}
function queue(){if(!frame)frame=requestAnimationFrame(render)}
for(const [tab,key] of Object.entries(categories)){
  const button=node("button",tab===category?"active":"",t(key));
  button.onclick=()=>{category=tab;for(const sibling of find("tabs").children)sibling.classList.toggle("active",sibling===button);queue()};
  find("tabs").append(button);
}
find("search").oninput=queue;
find("close").onclick=()=>send("close");
window.addEventListener("keydown",event=>{
  if(event.key==="Escape"||(closeKey&&event.key.toLowerCase()===closeKey)){event.preventDefault();send("close")}
});
window.addEventListener("configure",event=>{
  closeKey=event.detail?.key||"";
  language=event.detail?.language||"it";
  messages={...italian,...event.detail?.messages};
  document.documentElement.lang=language;
  document.documentElement.classList.toggle("text-theme",
    t("title")!=="Borsa da viaggio" || t("all")!=="Tutti" || t("Usa")!=="Usa");
  document.querySelector("h1").textContent=t("title");
  find("close").setAttribute("aria-label",t("close"));
  find("tabs").setAttribute("aria-label",t("tabs"));
  find("search").placeholder=t("search");
  find("search").setAttribute("aria-label",t("searchItems"));
  [...find("tabs").children].forEach((button,index)=>{
    button.textContent=t(Object.values(categories)[index]);
  });
  for(const card of cards.values())card.item=null;
  queue();
  find("shortcut").textContent=(closeKey?closeKey.toUpperCase()+" / ":"")+"Esc · "+t("close");
});
window.addEventListener("reset",()=>{
  rows.clear();selected=null;clearTimeout(actionTimer);pending=false;error.textContent="";queue();
});
window.addEventListener("status",event=>{
  const data=event.detail||{};
  find("slots").textContent=data.readOnly?t("readOnly"):data.slots==null?"":t("slots",data);
});
window.addEventListener("rows",event=>{for(const item of event.detail||[])rows.set(item.key,item);queue()});
window.addEventListener("remove",event=>{for(const key of event.detail||[])rows.delete(key);queue()});
window.addEventListener("action-done",()=>{clearTimeout(actionTimer);pending=false;renderDetail()});
window.addEventListener("error",event=>{clearTimeout(actionTimer);pending=false;error.textContent=event.detail?.message||t("unavailable");renderDetail()});
send("ready");
render();
</script>
</body>
</html>
